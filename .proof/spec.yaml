# Acceptance contract for proof itself.
#
# READ THIS FIRST IF YOU CAME HERE FOR AN EXAMPLE: your contract will look nothing like this
# one, and you do not want it to. proof is a CLI, so verifying it means building a throwaway
# project, running the CLI against it and checking the exit code — which is what every `run:`
# block below is doing behind its wall of shell. An ordinary contract is `http:`, `browser:`
# and `file:` checks that read like sentences. See README.md, docs/examples.md, or run
# `proof lint` on any contract to have it read back to you in English.
#
# The requirement is the one the tool exists to serve: a verdict has to mean something.
# So these check the promises an agent depends on — the exit codes, the refusals, and the
# machine-readable shape — not just that the suite is green.
goal: >-
  proof reports a verdict an agent can act on: 0 when the contract passed, 1 when it failed,
  2 when the contract itself is wrong, never DONE for something it did not verify, and never
  DONE on evidence that is not about this contract and this code

# The requirement, as the statements a verdict has to be about. Each one names something this
# tool promises; `satisfies:` below says which check is the evidence for it. A criterion with
# nothing pointing at it makes every run INCOMPLETE — which is the promise AC5 is about, held
# to itself.
criteria:
  - id: AC1
    requirement: a verdict is an exit code an agent can branch on — 0 passed, 1 failed, 2 the contract itself is wrong
    source: the README's exit-code table
  - id: AC2
    requirement: proof never reports DONE for something it did not verify
    source: the README's "a verdict that means something"
  - id: AC3
    requirement: a contract that would pass without the change is reported as not testing it
    source: docs/design.md, "do not trust the contract either"
  - id: AC4
    requirement: every run records the evidence behind its verdict, readable without the contract
    source: docs/evidence.md
  - id: AC5
    requirement: an acceptance criterion with no check pointing at it withholds the completion verdict
    source: the verification-boundary design note, section 2
  - id: AC6
    requirement: a contract edited after it was sealed invalidates the verification chain until it is resealed
    source: the verification-boundary design note, section 4
  - id: AC7
    requirement: a fault the contract accepts is reported as a weakness and kept as a counterexample
    source: the verification-boundary design note, section 6
  - id: AC8
    requirement: the completion verdict is derived from recorded evidence, never from a claim, and evidence from another contract or commit is refused
    source: the verification-boundary design note, sections 10 and 13
  - id: AC9
    requirement: a scenario that satisfies the contract and violates the claim is reported as a verification gap, with the counterexample kept and replayable
    source: the attack design note, sections 10 and 12
  - id: AC10
    requirement: a search that finds nothing reports what it tried and never reports correctness
    source: the attack design note, sections 19 and 28
  - id: AC11
    requirement: evidence from another branch is never read as this branch's history
    source: switching branches and running proof

checks:
  - name: unit tests
    run: npm test
    timeout: 900

  - name: cli is executable
    file: bin/proof.js

  - name: help lists every command
    run: node bin/proof.js --help
    expect_output: "proof report [run]"

  # The three exit codes, each against a contract built for it.
  - name: a passing contract exits 0
    satisfies: [AC1]
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: a\n    run: "true"\n' > "$d/.proof/spec.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check > /dev/null); rc=$?; rm -rf "$d"; exit $rc
    expect_exit: 0

  - name: a failing contract exits 1
    satisfies: [AC1]
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: a\n    run: exit 3\n' > "$d/.proof/spec.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check > /dev/null); rc=$?; rm -rf "$d"; exit $rc
    expect_exit: 1

  - name: a broken contract exits 2
    satisfies: [AC1]
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: a\n    frobnicate: 1\n' > "$d/.proof/spec.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1); rc=$?; rm -rf "$d"; exit $rc
    expect_exit: 2

  # The refusals that stop a verdict meaning less than it looks.
  - name: an unfinished contract is refused, not passed
    satisfies: [AC2]
    run: >-
      d=$(mktemp -d) &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" init "a requirement" > /dev/null &&
       node "$OLDPWD/bin/proof.js" check 2>&1); rc=$?; rm -rf "$d"; exit $rc
    expect_exit: 2
    expect_output: "placeholder"

  - name: a subset run never claims completion
    satisfies: [AC2]
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: alpha\n    run: "true"\n  - name: beta\n    run: "true"\n' > "$d/.proof/spec.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check --only alpha); rc=$?; rm -rf "$d"; exit $rc
    expect_output: "INCOMPLETE"

  # The shape an agent reads.
  - name: check --json carries a status and the evidence path
    satisfies: [AC4]
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: a\n    run: "true"\n' > "$d/.proof/spec.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check --json |
       node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);
         if (r.status!=="passed") process.exit(1); if (!r.run) process.exit(1); console.log("ok")})');
      rc=$?; rm -rf "$d"; exit $rc
    expect_output: "ok"

  - name: every run writes its evidence
    satisfies: [AC4]
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: a\n    run: echo hello\n' > "$d/.proof/spec.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check > /dev/null &&
       test -f .proof/runs/0001/result.json && test -f .proof/runs/0001/commands.log &&
       grep -q "asserted:" .proof/runs/0001/commands.log && echo recorded);
      rc=$?; rm -rf "$d"; exit $rc
    expect_output: "recorded"

  # Promises added since this contract was written.
  - name: an unreplaced route pattern is refused
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nserve:\n  run: sleep 30\n  ready_url: http://127.0.0.1:9\n  reuse_existing: true\nchecks:\n  - name: c\n    http: {path: /api/orders/:id}\n' > "$d/.proof/spec.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check 2>&1); rc=$?; rm -rf "$d"; exit $rc
    expect_exit: 2
    expect_output: "still has the route pattern"

  - name: a stale run does not exit 0
    run: >-
      d=$(mktemp -d) && cd "$d" && git init -q . && git config user.email t@t.t && git config user.name t &&
      mkdir -p .proof && echo v1 > app.js &&
      printf 'goal: g\nchecks:\n  - name: a\n    run: "true"\n' > .proof/spec.yaml &&
      git add -A && git commit -qm i > /dev/null &&
      node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1 && echo v2 > app.js &&
      node "$OLDPWD/bin/proof.js" report > /dev/null 2>&1; rc=$?; cd /; rm -rf "$d"; exit $rc
    expect_exit: 1

  - name: --spec is honoured by check
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/contracts" &&
      printf 'goal: g\nchecks:\n  - name: a\n    run: "true"\n' > "$d/contracts/release.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check --spec contracts/release.yaml > /dev/null &&
       test -f .proof/runs/0001/result.json && echo verified); rc=$?; rm -rf "$d"; exit $rc
    expect_output: "verified"

  - name: a signalled command is named, not reported as exit null
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: c\n    run: kill -9 $$\n' > "$d/.proof/spec.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check 2>&1 | grep -q "killed by SIGKILL" && echo named);
      rc=$?; rm -rf "$d"; exit $rc
    expect_output: "named"

  - name: a detaching launcher is not a boot failure
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" && cd "$d" &&
      printf 'import http from "node:http"\nhttp.createServer((q,s)=>{s.writeHead(200);s.end("ok")}).listen(8291)\n' > s.mjs &&
      printf '#!/bin/sh\nnohup node s.mjs >/dev/null 2>&1 &\necho $! > server.pid\nexit 0\n' > up.sh && chmod +x up.sh &&
      printf 'goal: g\nserve:\n  run: ./up.sh\n  ready_url: http://127.0.0.1:8291/\n  timeout: 15\nchecks:\n  - name: api\n    http: {path: /}\n' > .proof/spec.yaml &&
      node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1; rc=$?;
      kill "$(cat server.pid 2>/dev/null)" 2>/dev/null; cd /; rm -rf "$d"; exit $rc
    expect_exit: 0

  # An app with no HTTP surface — a worker, a daemon, a queue consumer. Polling a URL was the
  # only readiness proof knew, so this shape could not have a serve block at all. The marker
  # file is written before the ready line, so a contract that did not wait would race it.
  - name: an app with no http surface can be verified
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" && cd "$d" &&
      printf 'setTimeout(()=>{require("fs").writeFileSync("ready.txt","up");console.log("worker consuming from queue")},500)\nsetInterval(()=>{},1e4)\n' > w.js &&
      printf 'goal: g\nserve:\n  run: node w.js\n  ready_log: "consuming from queue"\n  timeout: 20\nchecks:\n  - name: marker\n    file: ready.txt\n' > .proof/spec.yaml &&
      node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1; rc=$?; cd /; rm -rf "$d"; exit $rc
    expect_exit: 0

  # A Go import names a package, so the edge sits on the directory. Every .go file used to come
  # back as not import-scannable, which is an honest answer and an empty radius.
  - name: a go file has a derivable blast radius
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" "$d/store" "$d/service" && cd "$d" &&
      git init -q . && git config user.email t@t.t && git config user.name t &&
      printf 'module github.com/acme/app\n' > go.mod &&
      printf 'package store\ntype Order struct{}\n' > store/store.go &&
      printf 'package service\nimport "github.com/acme/app/store"\nfunc X(o store.Order) {}\n' > service/service.go &&
      printf 'goal: g\nchecks:\n  - name: t\n    run: "true"\n' > .proof/spec.yaml &&
      git add -A && git commit -qm base > /dev/null &&
      printf 'package store\ntype Order struct{ ID int }\n' > store/store.go &&
      out=$(node "$OLDPWD/bin/proof.js" changed 2>&1); cd /; rm -rf "$d";
      printf '%s' "$out" | grep -q 'service/service.go'
    expect_exit: 0

  # A real application is more than one process. The api refuses to start until the db has
  # written its marker, so a run that booted these out of order could not pass — and the
  # per-process check names are what a failure has to be readable through.
  - name: a multi-process stack boots in dependency order
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" && cd "$d" &&
      printf 'require("fs").writeFileSync("db-up","1")\nconsole.log("db accepting connections")\nsetInterval(()=>{},1e4)\n' > db.js &&
      printf 'if(!require("fs").existsSync("db-up")){console.error("no db");process.exit(1)}\nrequire("http").createServer((q,s)=>s.end("ok")).listen(8451)\nconsole.log("api up")\n' > api.js &&
      printf 'goal: g\nserve:\n  - name: db\n    run: node db.js\n    ready_log: "accepting connections"\n    timeout: 20\n  - name: api\n    run: node api.js\n    ready_url: http://127.0.0.1:8451/\n    timeout: 20\nchecks:\n  - name: api answers\n    http: {path: /, expect: {body_contains: "ok"}}\n' > .proof/spec.yaml &&
      out=$(node "$OLDPWD/bin/proof.js" check 2>&1); rc=$?; cd /; rm -rf "$d";
      test $rc -eq 0 && printf '%s' "$out" | grep -q 'app boots (api)'
    expect_exit: 0

  # A repository in a language proof has no detector for had no route source at all, so every
  # gap list came back empty — which reads as "nothing to verify" for an API fully described
  # on disk. The document is the one route source that is not a language.
  - name: an api document is a route source in any language
    run: >-
      d=$(mktemp -d) && cd "$d" &&
      printf 'openapi: 3.0.0\npaths:\n  /orders:\n    get: {}\n' > openapi.yaml &&
      printf 'class C {}\n' > C.java &&
      git init -q . && git config user.email t@t.t && git config user.name t &&
      git add -A && git commit -qm base > /dev/null &&
      printf 'class C { void x(); }\n' > C.java &&
      out=$(node "$OLDPWD/bin/proof.js" infer 2>&1); cd /; rm -rf "$d";
      printf '%s' "$out" | grep -q 'GET /orders is reachable'
    expect_exit: 0

  # Absence of an answer is not an answer. `changed` printed "nothing to verify" outside a
  # repository, where it had not looked at anything at all.
  - name: a blast radius it could not compute is refused, not reported as empty
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: t\n    run: "true"\n' > "$d/.proof/spec.yaml" &&
      out=$(cd "$d" && node "$OLDPWD/bin/proof.js" changed 2>&1); rc=$?; rm -rf "$d";
      test $rc -eq 2 && ! printf '%s' "$out" | grep -q 'nothing to verify'
    expect_exit: 0

  # The listing is where you are sent when a run cannot be read. It must not be the one
  # place still willing to vouch for it.
  - name: a run that cannot be read never shows a verdict
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof/runs/0001" &&
      printf 'goal: g\nchecks:\n  - name: t\n    run: "true"\n' > "$d/.proof/spec.yaml" &&
      printf '{"status":"passed"}' > "$d/.proof/runs/0001/result.json" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" report --list --json); rc=$?; rm -rf "$d"; exit $rc
    expect_output: '"status": "unreadable"'

  # The goal's last clause, in the form that is easiest to get wrong: an assertion about
  # what a response does NOT contain proves nothing about what it does.
  - name: asserting an absence does not silence the content advisory
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'import http from "node:http"\nhttp.createServer((q,s)=>{s.writeHead(200);s.end("hi")}).listen(8412)\n' > "$d/s.mjs" &&
      printf 'goal: g\nserve:\n  run: node s.mjs\n  ready_url: http://127.0.0.1:8412/\n  timeout: 20\nchecks:\n  - name: page\n    http:\n      path: /\n      expect: {status: 200, body_not_contains: "stack trace"}\n' > "$d/.proof/spec.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check); rc=$?; rm -rf "$d"; exit $rc
    expect_output: "asserts what the app actually returned"

  # The thesis, at the layer that gets acted on. A verdict is a claim about a contract and a
  # suite; when the same diff rewrote either, the verdict alone cannot show it.
  - name: a verdict says when the verification itself moved
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" "$d/test" &&
      printf 'goal: g\nchecks:\n  - name: unit tests\n    run: "true"\n' > "$d/.proof/spec.yaml" &&
      printf 'ok\n' > "$d/test/a.test.js" &&
      (cd "$d" && git init -q -b main . && git config user.email t@t.t && git config user.name t &&
       git add -A && git commit -qm base) > /dev/null 2>&1 &&
      printf 'relaxed\n' >> "$d/test/a.test.js" &&
      out=$(cd "$d" && node "$OLDPWD/bin/proof.js" check 2>&1); rm -rf "$d";
      printf '%s' "$out" | grep -q 'existing test file'
    expect_exit: 0

  # The completion gate itself: an agent that never fixes anything is stopped by the
  # override with exit 1, and one whose work passes ends the loop with exit 0.
  - name: guard gates on the contract, not on the agent
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: marker\n    file: {path: marker.txt}\n' > "$d/.proof/spec.yaml" &&
      printf '#!/bin/sh\ntrue\n' > "$d/agent.sh" && chmod +x "$d/agent.sh" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" guard --max-attempts 2 -- ./agent.sh > /dev/null 2>&1); a=$?;
      printf '#!/bin/sh\ntouch marker.txt\n' > "$d/agent.sh" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" guard --max-attempts 2 -- ./agent.sh > /dev/null 2>&1); b=$?;
      rm -rf "$d"; test $a -eq 1 && test $b -eq 0
    expect_exit: 0

  # Two ways a run could answer a question nobody asked. `--only ""` selected every check,
  # because every name contains the empty string — a subset run that made the completion
  # claim the flag exists to withhold.
  - name: an empty --only is refused, not read as "every check"
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: alpha\n    run: "true"\n' > "$d/.proof/spec.yaml" &&
      out=$(cd "$d" && node "$OLDPWD/bin/proof.js" check --only "" 2>&1); rc=$?; rm -rf "$d";
      test $rc -eq 2 && ! printf '%s' "$out" | grep -q 'DONE'
    expect_exit: 0

  # `expect_output` is only read on a `run:` check. Written on any other verb it validated,
  # ran, and the check reported PASS having evaluated one clause fewer than its author wrote.
  - name: an assertion the runner would never read is refused
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: a\n    file: x.txt\n    expect_output: "hi"\n' > "$d/.proof/spec.yaml" &&
      out=$(cd "$d" && node "$OLDPWD/bin/proof.js" check 2>&1); rc=$?; rm -rf "$d";
      test $rc -eq 2 && printf '%s' "$out" | grep -q 'never read on a'
    expect_exit: 0

  # A contract could not say the most ordinary thing there is to say about an API — create it,
  # then read it back — so every path was a literal and contracts hardcoded a row someone had
  # seen in their own database once.
  - name: a value one check produces is used by the next
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" && cd "$d" &&
      printf 'import http from "node:http"\nlet n=100\nconst kept=new Map()\nhttp.createServer((q,s)=>{\n if(q.method==="POST"){const id=n++;kept.set(String(id),id);s.writeHead(201,{"content-type":"application/json"});return s.end(JSON.stringify({id}))}\n const m=q.url.match(/^\\/orders\\/(\\d+)$/)\n if(m&&kept.has(m[1])){s.writeHead(200,{"content-type":"application/json"});return s.end(JSON.stringify({id:Number(m[1])}))}\n s.writeHead(404);s.end()\n}).listen(8477)\n' > s.mjs &&
      printf 'goal: g\nserve:\n  run: node s.mjs\n  ready_url: http://127.0.0.1:8477/orders/1\n  timeout: 20\nchecks:\n  - name: create\n    http: {method: POST, path: /orders, expect: {status: 201}}\n    capture: {order_id: json.id}\n  - name: read it back\n    http: {path: "/orders/${order_id}", expect: {status: 200, json: {id: "${order_id}"}}}\n' > .proof/spec.yaml &&
      node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1; rc=$?; cd /; rm -rf "$d"; exit $rc
    expect_exit: 0

  # A reference nothing captures is a typo, and answering it by booting the app and running
  # everything before it would be a failure reported for something proof could see in the file.
  - name: a reference nothing captures is refused before anything boots
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nserve:\n  run: sleep 30\n  ready_url: http://127.0.0.1:9\nchecks:\n  - name: c\n    http: {path: "/orders/${nope}"}\n' > "$d/.proof/spec.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check 2>&1); rc=$?; rm -rf "$d"; exit $rc
    expect_exit: 2
    expect_output: "which no check captures"

  # Deleting a check an agent cannot satisfy is invisible in the blast radius and the next run
  # reports DONE. The sanctioned alternative has to cost the completion claim, or it is the
  # same hole with a nicer name.
  - name: a skipped check is refused a completion verdict
    satisfies: [AC2]
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: a\n    run: "true"\n  - name: b\n    run: "true"\n    skip: "see #412"\n' > "$d/.proof/spec.yaml" &&
      out=$(cd "$d" && node "$OLDPWD/bin/proof.js" check 2>&1); rc=$?; rm -rf "$d";
      test $rc -eq 0 && printf '%s' "$out" | grep -q 'INCOMPLETE' && ! printf '%s' "$out" | grep -qx '  DONE'
    expect_exit: 0

  # Every run of this contract is on disk, and the only one ever consulted was the last: a
  # check that passes four runs in five rendered exactly like one that always passes.
  - name: a check that does not agree with itself is named on a green run
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" && cd "$d" &&
      printf 'goal: g\nchecks:\n  - name: coin\n    run: test -f flip\n' > .proof/spec.yaml &&
      node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1; touch flip &&
      node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1 &&
      out=$(node "$OLDPWD/bin/proof.js" check 2>&1); rc=$?; cd /; rm -rf "$d";
      test $rc -eq 0 && printf '%s' "$out" | grep -q 'has not agreed with itself'
    expect_exit: 0

  # A verdict that lives only in a terminal is a verdict nobody sees on the pull request.
  - name: a run renders as junit for ci
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: a\n    run: "true"\n' > "$d/.proof/spec.yaml" &&
      (cd "$d" && node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1 &&
       node "$OLDPWD/bin/proof.js" report --junit); rc=$?; rm -rf "$d"; exit $rc
    expect_output: '<testcase name="a"'

  # The question underneath every other one here: would this contract have noticed if the
  # change had never been made? A check that passes on the code from before the diff reports
  # DONE for a branch that did nothing, and nothing in a green run says so.
  - name: a contract that passes without the change is refused
    satisfies: [AC3]
    run: >-
      d=$(mktemp -d) && cd "$d" && git init -q -b main . &&
      git config user.email t@t.t && git config user.name t &&
      echo old > app.txt && mkdir -p .proof &&
      printf 'goal: g\nchecks:\n  - name: the file is there\n    file: app.txt\n' > .proof/spec.yaml &&
      git add -A && git commit -qm before > /dev/null &&
      echo 'new: the feature' > app.txt &&
      out=$(node "$OLDPWD/bin/proof.js" falsify 2>&1); rc=$?; cd /; rm -rf "$d";
      test $rc -eq 1 && printf '%s' "$out" | grep -q 'DOES NOT DISCRIMINATE'
    expect_exit: 0

  # And the other direction, including the refusal that keeps it honest: a contract that fails
  # on the base only because the base could not run has proved nothing about itself.
  - name: a contract that needs the change discriminates, and a boot failure does not
    satisfies: [AC3]
    run: >-
      d=$(mktemp -d) && cd "$d" && git init -q -b main . &&
      git config user.email t@t.t && git config user.name t &&
      echo old > app.txt && mkdir -p .proof &&
      printf 'goal: g\nchecks:\n  - name: c\n    file: {path: app.txt, contains: "feature"}\n' > .proof/spec.yaml &&
      git add -A && git commit -qm before > /dev/null &&
      echo 'new: the feature' > app.txt &&
      node "$OLDPWD/bin/proof.js" falsify > /dev/null 2>&1; a=$?;
      printf 'goal: g\nserve:\n  run: exit 1\n  ready_url: http://127.0.0.1:9\n  timeout: 2\nchecks:\n  - name: c\n    http: {path: /, expect: {status: 200}}\n' > .proof/spec.yaml &&
      node "$OLDPWD/bin/proof.js" falsify > /dev/null 2>&1; b=$?;
      cd /; rm -rf "$d"; test $a -eq 0 && test $b -eq 2
    expect_exit: 0

  # `run:` told proof one thing, the exit code, so three failing tests arrived as `exit 1` and
  # the evidence held less than the terminal it came from. And a runner given a filter that
  # matches nothing runs nothing and exits 0 — this tool's own subject, arriving through the
  # check written to catch everything else.
  - name: a runner's own report is read, and an empty one is not a pass
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" && cd "$d" &&
      printf '<testsuites><testsuite name="s"><testcase name="a" classname="auth"/><testcase name="b" classname="auth"><failure message="expected 401, got 200"/></testcase></testsuite></testsuites>' > report.xml &&
      printf 'goal: g\nchecks:\n  - name: suite\n    run: exit 1\n    results: report.xml\n' > .proof/spec.yaml &&
      out=$(node "$OLDPWD/bin/proof.js" check 2>&1); a=$?;
      printf '<testsuites><testsuite name="s"></testsuite></testsuites>' > report.xml &&
      printf 'goal: g\nchecks:\n  - name: suite\n    run: "true"\n    results: report.xml\n' > .proof/spec.yaml &&
      empty=$(node "$OLDPWD/bin/proof.js" check 2>&1); b=$?; cd /; rm -rf "$d";
      test $a -eq 1 && test $b -eq 1 &&
      printf '%s' "$out" | grep -q 'auth . b — expected 401, got 200' &&
      printf '%s' "$empty" | grep -q 'records 0 tests'
    expect_exit: 0

  # The contract is the definition of "done", so it has to be something a human can read back.
  - name: lint reads a contract back without running it
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nserve:\n  run: sleep 30\n  ready_url: http://127.0.0.1:9\nchecks:\n  - name: the profile page shows the user\n    http: {path: /profile, expect: {status: 200, body_contains: "ada"}}\n' > "$d/.proof/spec.yaml" &&
      out=$(cd "$d" && node "$OLDPWD/bin/proof.js" lint 2>&1); rc=$?;
      ran=$(test -d "$d/.proof/runs" && echo yes || echo no); rm -rf "$d";
      test $rc -eq 0 && test "$ran" = no &&
      printf '%s' "$out" | grep -q 'GET /profile, status 200, body contains "ada"'
    expect_exit: 0

  # The four questions a verdict has to answer, each held to itself. Coverage first: this
  # contract's own criteria are what AC5 is about, so the check for it builds a contract with a
  # criterion nobody covered and reads back what the verdict does.
  - name: an uncovered acceptance criterion is refused a completion verdict
    satisfies: [AC5]
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\ncriteria:\n  - id: AC1\n    requirement: covered\n  - id: AC2\n    requirement: nothing points at this\nchecks:\n  - name: a\n    satisfies: [AC1]\n    run: "true"\n' > "$d/.proof/spec.yaml" &&
      out=$(cd "$d" && node "$OLDPWD/bin/proof.js" check 2>&1); rc=$?; rm -rf "$d";
      test $rc -eq 0 && printf '%s' "$out" | grep -q 'INCOMPLETE' && printf '%s' "$out" | grep -q 'AC2'
    expect_exit: 0

  # Integrity. The contract is the definition of done, so an agent that cannot satisfy it can
  # edit it. Sealing does not forbid that; it stops the edit from being invisible.
  - name: a contract edited after sealing costs the completion verdict
    satisfies: [AC6]
    run: >-
      d=$(mktemp -d) && mkdir -p "$d/.proof" &&
      printf 'goal: g\nchecks:\n  - name: a\n    run: "true"\n' > "$d/.proof/spec.yaml" &&
      out=$(cd "$d" && node "$OLDPWD/bin/proof.js" seal > /dev/null &&
       printf 'goal: g\nchecks:\n  - name: a\n    run: "true"\n    timeout: 30\n' > .proof/spec.yaml &&
       node "$OLDPWD/bin/proof.js" check 2>&1); rm -rf "$d";
      printf '%s' "$out" | grep -q 'since it was sealed' && printf '%s' "$out" | grep -q 'INCOMPLETE'
    expect_exit: 0

  # Strength. A contract can need the change and still accept a wrong version of it, and the
  # useful output is which faults it caught rather than a score.
  - name: a fault the contract accepts is reported and kept as a counterexample
    satisfies: [AC7]
    run: >-
      d=$(mktemp -d) && cd "$d" && git init -q -b main . &&
      git config user.email t@t.t && git config user.name t &&
      mkdir -p .proof && echo 'the feature' > app.txt &&
      printf 'goal: g\nchecks:\n  - name: the file is there\n    file: app.txt\nchallenges:\n  - name: remove the feature\n    apply: "printf nothing > app.txt"\n' > .proof/spec.yaml &&
      git add -A && git commit -qm base > /dev/null &&
      out=$(node "$OLDPWD/bin/proof.js" challenge 2>&1); rc=$?;
      kept=$(test -f .proof/counterexamples/remove-the-feature.yaml && echo yes || echo no);
      cd /; rm -rf "$d";
      test $rc -eq 1 && test "$kept" = yes && printf '%s' "$out" | grep -q 'MISSED'
    expect_exit: 0

  # The gate itself. Nothing is asserted about the work by the thing doing the work: `done`
  # runs no checks, it reads the records `falsify` and `check` wrote and derives the verdict.
  - name: done gates on the recorded chain, not on a claim
    satisfies: [AC8]
    run: >-
      d=$(mktemp -d) && cd "$d" && git init -q -b main . &&
      git config user.email t@t.t && git config user.name t &&
      mkdir -p .proof && echo old > app.txt &&
      printf 'goal: g\ncriteria:\n  - id: AC1\n    requirement: the feature is in the file\nchecks:\n  - name: the feature is there\n    satisfies: [AC1]\n    file: {path: app.txt, contains: "the feature"}\n' > .proof/spec.yaml &&
      git add -A && git commit -qm before > /dev/null &&
      echo 'the feature' > app.txt &&
      node "$OLDPWD/bin/proof.js" done > /dev/null 2>&1; before=$?;
      node "$OLDPWD/bin/proof.js" falsify > /dev/null 2>&1 &&
      git commit -qam change > /dev/null &&
      node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1 &&
      out=$(node "$OLDPWD/bin/proof.js" done 2>&1); after=$?;
      manifest=$(test -f .proof/report.json && echo yes || echo no); cd /; rm -rf "$d";
      test $before -eq 1 && test $after -eq 0 && test "$manifest" = yes &&
      printf '%s' "$out" | grep -q 'DONE'
    expect_exit: 0

  # And the other half of AC8: a run is a verdict about one contract. Reusing it across a
  # contract change would be the quietest way for this whole layer to lie.
  - name: evidence recorded under another contract is refused, not reused
    satisfies: [AC8]
    run: >-
      d=$(mktemp -d) && cd "$d" && git init -q -b main . &&
      git config user.email t@t.t && git config user.name t &&
      mkdir -p .proof && echo 'the feature' > app.txt &&
      printf 'goal: g\nchecks:\n  - name: the feature is there\n    file: {path: app.txt, contains: "the feature"}\npolicy:\n  require_falsification: false\n' > .proof/spec.yaml &&
      git add -A && git commit -qm base > /dev/null &&
      node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1 &&
      printf 'goal: g\nchecks:\n  - name: the feature is there\n    file: {path: app.txt, contains: "feature"}\npolicy:\n  require_falsification: false\n' > .proof/spec.yaml &&
      out=$(node "$OLDPWD/bin/proof.js" done 2>&1); rc=$?; cd /; rm -rf "$d";
      test $rc -eq 1 && printf '%s' "$out" | grep -q 'INVALID'
    expect_exit: 0

  # The finding this tool exists for, at the layer nothing else can see: the contract passes, the
  # claim is violated. The app below has the textbook read-then-write window, and the contract
  # asks twice in a row — which the app answers correctly.
  - name: a scenario the contract accepts and the claim forbids is a verification gap
    satisfies: [AC9]
    timeout: 180
    run: >-
      d=$(mktemp -d) && cd "$d" && git init -q -b main . &&
      git config user.email t@t.t && git config user.name t && mkdir -p .proof &&
      printf 'import http from "node:http"\nconst used=new Set()\nlet n=0\nhttp.createServer(async(q,s)=>{\n const j=(c,b)=>{s.writeHead(c,{"content-type":"application/json"});s.end(JSON.stringify(b))}\n if(q.url==="/issue")return j(200,{token:"t"+(n++)})\n let b="";for await(const c of q)b+=c\n const t=(JSON.parse(b||"{}")).token\n if(used.has(t))return j(401,{error:"used"})\n await new Promise(r=>setTimeout(r,5))\n used.add(t)\n j(200,{ok:true})\n}).listen(8593)\n' > s.mjs &&
      printf 'goal: a token can only be redeemed once\nserve:\n  run: node s.mjs\n  ready_url: http://127.0.0.1:8593/issue\n  timeout: 20\ncriteria:\n  - id: AC1\n    requirement: a token cannot be redeemed twice\n    attack:\n      surfaces: [concurrency]\n      setup:\n        - name: issue\n          http: {method: POST, path: /issue}\n          capture: {token: json.token}\n      actions:\n        - name: redeem\n          http: {method: POST, path: /redeem, body: {token: "${token}"}}\n      invariants:\n        - successful_redeem <= 1\nchecks:\n  - name: a token is issued\n    http: {method: POST, path: /issue, expect: {status: 200}}\n    capture: {t: json.token}\n  - name: redeeming it works\n    http: {method: POST, path: /redeem, body: {token: "${t}"}, expect: {status: 200}}\n  - name: redeeming it again is refused\n    satisfies: [AC1]\n    http: {method: POST, path: /redeem, body: {token: "${t}"}, expect: {status: 401}}\n' > .proof/spec.yaml &&
      git add -A && git commit -qm base > /dev/null &&
      node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1; passed=$?;
      out=$(node "$OLDPWD/bin/proof.js" attack 2>&1); found=$?;
      kept=$(ls .proof/counterexamples 2>/dev/null | wc -l);
      id=$(ls .proof/counterexamples 2>/dev/null | head -1 | sed 's/.yaml//');
      node "$OLDPWD/bin/proof.js" replay "$id" > /dev/null 2>&1; again=$?;
      cd /; rm -rf "$d";
      test $passed -eq 0 && test $found -eq 1 && test "$kept" -eq 1 && test $again -eq 1 &&
      printf '%s' "$out" | grep -q 'VERIFICATION_GAP'
    expect_exit: 0

  # And the other half of the same promise: a search that comes back empty is a budget that ran
  # out. The one sentence this tool must never print is "no bugs".
  - name: a search that finds nothing refuses to report correctness
    satisfies: [AC10]
    timeout: 180
    run: >-
      d=$(mktemp -d) && cd "$d" && git init -q -b main . &&
      git config user.email t@t.t && git config user.name t && mkdir -p .proof &&
      printf 'import http from "node:http"\nconst used=new Set()\nlet n=0\nhttp.createServer(async(q,s)=>{\n const j=(c,b)=>{s.writeHead(c,{"content-type":"application/json"});s.end(JSON.stringify(b))}\n if(q.url==="/issue")return j(200,{token:"t"+(n++)})\n let b="";for await(const c of q)b+=c\n const t=(JSON.parse(b||"{}")).token\n if(used.has(t))return j(401,{error:"used"})\n used.add(t)\n await new Promise(r=>setTimeout(r,5))\n j(200,{ok:true})\n}).listen(8594)\n' > s.mjs &&
      printf 'goal: a token can only be redeemed once\nserve:\n  run: node s.mjs\n  ready_url: http://127.0.0.1:8594/issue\n  timeout: 20\ncriteria:\n  - id: AC1\n    requirement: a token cannot be redeemed twice\n    attack:\n      surfaces: [concurrency]\n      budget: {duration: 30, candidates: 6, concurrency: 3}\n      setup:\n        - name: issue\n          http: {method: POST, path: /issue}\n          capture: {token: json.token}\n      actions:\n        - name: redeem\n          http: {method: POST, path: /redeem, body: {token: "${token}"}}\n      invariants:\n        - successful_redeem <= 1\nchecks:\n  - name: a token is issued\n    http: {method: POST, path: /issue, expect: {status: 200}}\n    capture: {t: json.token}\n  - name: redeeming it again is refused\n    satisfies: [AC1]\n    http: {method: POST, path: /redeem, body: {token: "${t}"}, expect: {status: 200}}\n' > .proof/spec.yaml &&
      git add -A && git commit -qm base > /dev/null &&
      out=$(node "$OLDPWD/bin/proof.js" attack 2>&1); rc=$?; cd /; rm -rf "$d";
      test $rc -eq 0 && printf '%s' "$out" | grep -q 'NO COUNTEREXAMPLE FOUND' &&
      printf '%s' "$out" | grep -q 'does not establish correctness' &&
      printf '%s' "$out" | grep -q 'candidates evaluated'
    expect_exit: 0

  # Branches share one `.proof/runs` directory, so the run before this one is not always a run
  # about this code. The field that suffers most is the one an agent acts on hardest: a
  # regression means "you broke this", and across a branch switch it was somebody else's work.
  - name: a run from another branch is not read as this branch's history
    satisfies: [AC11]
    run: >-
      d=$(mktemp -d) && cd "$d" && git init -q -b main . &&
      git config user.email t@t.t && git config user.name t && mkdir -p .proof &&
      printf 'old\n' > app.txt &&
      printf 'goal: g\nchecks:\n  - name: the feature is there\n    file: {path: app.txt, contains: "the feature"}\n' > .proof/spec.yaml &&
      git add -A && git commit -qm base > /dev/null &&
      git checkout -q -b feature && printf 'the feature\n' > app.txt &&
      git commit -qam feature > /dev/null &&
      node "$OLDPWD/bin/proof.js" check > /dev/null 2>&1; passed=$?;
      git checkout -q main &&
      out=$(node "$OLDPWD/bin/proof.js" check 2>&1); failed=$?;
      printf 'broken\n' > app.txt && git commit -qam break > /dev/null &&
      git checkout -q feature && printf 'gone\n' > app.txt &&
      same=$(node "$OLDPWD/bin/proof.js" check 2>&1);
      cd /; rm -rf "$d";
      test $passed -eq 0 && test $failed -eq 1 &&
      ! printf '%s' "$out" | grep -q 'Regression' &&
      printf '%s' "$same" | grep -q 'Regression'
    expect_exit: 0

# Faults this contract has to catch. Each one is injected into a throwaway copy of the
# repository and the whole contract is run against it, so `proof challenge` here costs several
# full runs of the suite — it is a command you run deliberately, not on every commit.
challenges:
  - name: stop refusing an unfinished contract
    breaks: [AC2]
    apply: "sed -i 's/if (unfinished.length) {/if (false) {/' src/check.js"

  - name: let an uncovered criterion claim completion
    breaks: [AC5]
    apply: "sed -i 's/|| uncoveredIds.length > 0//' src/check.js"

  - name: accept any exit code a command happens to return
    breaks: [AC1]
    apply: "sed -i 's/const wantExit = c.expect_exit ?? 0/const wantExit = r.code/' src/check.js"

  - name: let a modified contract keep its completion verdict
    breaks: [AC6]
    apply: "sed -i \"s/|| seal.status === 'modified'//\" src/check.js"
